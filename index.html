<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penimbangan Mobil Pick-Up</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f2f2f2;
    }
    select, input[type="file"] {
      padding: 5px;
      font-size: 16px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #45a049;
    }
    #reader {
      width: 320px;
      margin: 20px auto;
    }
    table {
      margin-top: 20px;
      margin-bottom: 20px;
      border-collapse: collapse;
      width: 80%;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #2c3e50;
      color: white;
    }
    #hasil {
      font-weight: bold;
      margin-top: 20px;
      color: green;
    }
    #total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>Penimbangan Mobil Pick-Up</h2>
  
  <label for="mobil">Pilih Jenis Mobil:</label>
  <select id="mobil">
    <option value="1000">Toyota Hilux (1000 kg)</option>
    <option value="1500">Isuzu D-Max (1500 kg)</option>
    <option value="1200">Mitsubishi L200 (1200 kg)</option>
    <option value="2000">Nissan Navara (2000 kg)</option>
  </select>

  <br>

  <label for="muatan">Masukkan Berat Muatan (kg):</label>
  <input type="number" id="muatan" placeholder="Berat Muatan (kg)" />

  <br>
  
  <button id="hitungBtn">Hitung Berat Kotor & Total Harga</button>
  
  <div id="hasil"></div>

  <div id="total"></div>

  <h3>Scan QR untuk Foto Mobil:</h3>
  <div id="reader"></div>

  <script>
    const hargaPerKg = 1000; // Harga per kg

    document.getElementById("hitungBtn").addEventListener("click", function() {
      const jenisMobil = document.getElementById("mobil").value; // Berat mobil pick-up
      const beratMuatan = parseFloat(document.getElementById("muatan").value); // Berat muatan dari input
      const beratMobil = parseFloat(jenisMobil); // Berat mobil yang dipilih
      const beratKotor = beratMobil + beratMuatan; // Berat Kotor = Berat Mobil + Muatan
      const hargaTotal = beratKotor * hargaPerKg; // Harga = Berat Kotor * Harga per kg

      // Tampilkan hasil perhitungan
      document.getElementById("hasil").innerHTML = `
        Berat Mobil: ${beratMobil} kg<br>
        Berat Muatan: ${beratMuatan} kg<br>
        Berat Kotor: ${beratKotor} kg<br>
        Berat Muatan: ${beratMuatan} kg<br>
      `;
      document.getElementById("total").innerHTML = `Total Harga: Rp ${hargaTotal.toLocaleString()}`;
    });

    // Kamera QR Code
    const html5QrCode = new Html5Qrcode("reader");

    function mulaiScan(cameraId) {
      html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: 250 },
        qrText => {
          alert("QR Code Terdeteksi: " + qrText); // QR Code terdeteksi
        },
        error => {}
      ).catch(err => {
        document.getElementById("hasil").innerText = "Gagal akses kamera: " + err;
      });
    }

    Html5Qrcode.getCameras().then(devices => {
      if (devices.length === 0) {
        document.getElementById("hasil").innerText = "Kamera tidak ditemukan.";
        return;
      }

      devices.forEach(device => {
        const option = document.createElement("option");
        option.value = device.id;
        option.text = device.label || `Kamera ${cameraSelect.length + 1}`;
        cameraSelect.appendChild(option);
      });

      mulaiScan(devices[0].id);
    }).catch(err => {
      document.getElementById("hasil").innerText = "Tidak dapat mengakses kamera: " + err;
    });
  </script>

</body>
</html>
