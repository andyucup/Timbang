<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick-Up Mobil & Hitung Pembayaran</title>
</head>
<body>

<h1>Selamat Datang di Aplikasi Hitung Pembayaran</h1>

<!-- Pilihan Jenis Mobil -->
<label for="pickupType">Pilih Jenis Mobil Pick-Up:</label>
<select id="pickupType">
    <option value="small">Pick-Up Kecil (500kg)</option>
    <option value="medium">Pick-Up Sedang (1000kg)</option>
    <option value="large">Pick-Up Besar (1500kg)</option>
</select>

<br><br>

<!-- Button untuk Mengambil Foto -->
<button id="takePhoto">Ambil Foto Muatan</button>
<video id="video" width="300" height="200" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>
<br>

<!-- Formulir untuk Berat Muatan dan Harga -->
<div>
    <label for="muatanWeight">Berat Muatan (kg): </label>
    <input type="number" id="muatanWeight" placeholder="Masukkan berat muatan" disabled>
</div>
<div>
    <label for="hargaPerKg">Harga per kg (Rp): </label>
    <input type="number" id="hargaPerKg" value="5000" disabled>
</div>
<div>
    <p>Total Harga: <span id="totalHarga">0</span> Rupiah</p>
</div>

<!-- Pembayaran -->
<div>
    <label for="payment">Pembayaran Tunai (Rp): </label>
    <input type="number" id="payment" placeholder="Masukkan pembayaran tunai">
</div>
<div>
    <p>Kembalian: <span id="change">0</span> Rupiah</p>
</div>

<script>
    // Menyiapkan kamera
    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");
    let context = canvas.getContext("2d");
    let takePhotoButton = document.getElementById("takePhoto");

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
    }

    takePhotoButton.addEventListener('click', () => {
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Simulasi menghitung berat muatan dari foto
        let estimatedWeight = Math.random() * 1000 + 500; // Simulasi berat muatan antara 500 - 1500 kg
        document.getElementById("muatanWeight").value = estimatedWeight.toFixed(2);
        calculatePrice();
    });

    function calculatePrice() {
        let muatanWeight = parseFloat(document.getElementById("muatanWeight").value);
        let hargaPerKg = parseFloat(document.getElementById("hargaPerKg").value);
        let totalHarga = muatanWeight * hargaPerKg;
        document.getElementById("totalHarga").textContent = totalHarga.toFixed(2);

        // Menghitung pembayaran dan kembalian
        let payment = parseFloat(document.getElementById("payment").value) || 0;
        let change = payment - totalHarga;
        document.getElementById("change").textContent = change.toFixed(2);
    }

    document.getElementById("pickupType").addEventListener('change', () => {
        let pickupType = document.getElementById("pickupType").value;
        let weightLimit;
        switch (pickupType) {
            case "small":
                weightLimit = 500;
                break;
            case "medium":
                weightLimit = 1000;
                break;
            case "large":
                weightLimit = 1500;
                break;
        }
        // Menampilkan berat muatan maksimal yang dapat diambil oleh mobil
        document.getElementById("muatanWeight").max = weightLimit;
    });

    // Mulai kamera saat halaman dibuka
    startCamera();

    // Memperbarui perhitungan jika ada perubahan di pembayaran
    document.getElementById("payment").addEventListener('input', calculatePrice);

</script>

</body>
</html>
