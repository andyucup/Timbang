<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengenalan Benda dan Estimasi Berat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        video {
            width: 100%;
            border: 1px solid #ccc;
        }
        #predictedWeight {
            font-size: 1.5em;
            margin-top: 20px;
            color: #333;
        }
        .info {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pengenalan Benda dan Estimasi Berat</h1>
    <video id="video" width="640" height="480" autoplay></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    <div class="info">
        <h2>Perkiraan Berat:</h2>
        <p id="predictedWeight">Belum ada data</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
    // Akses elemen HTML
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    const predictedWeightElem = document.getElementById("predictedWeight");

    // Model COCO-SSD untuk deteksi objek
    let model;

    // Memuat model COCO-SSD
    async function loadModel() {
        model = await cocoSsd.load();
        detectObjects();
    }

    // Menyiapkan kamera belakang
    async function startCamera() {
        const constraints = {
            video: { facingMode: "environment" }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
    }

    // Fungsi untuk mendeteksi objek dan memperkirakan berat
    async function detectObjects() {
        const predictions = await model.detect(video);
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        predictions.forEach(prediction => {
            // Menampilkan kotak dan label objek
            context.beginPath();
            context.rect(prediction.bbox[0], prediction.bbox[1], prediction.bbox[2], prediction.bbox[3]);
            context.lineWidth = 2;
            context.strokeStyle = "red";
            context.fillStyle = "red";
            context.fillText(prediction.class, prediction.bbox[0], prediction.bbox[1] > 10 ? prediction.bbox[1] - 5 : 10);

            // Perkirakan berat berdasarkan objek yang terdeteksi
            let weight = estimateWeight(prediction.class);
            predictedWeightElem.textContent = `Prediksi Berat: ${weight} kg`;
        });

        // Panggil deteksi objek lagi setiap detik
        setTimeout(detectObjects, 1000);
    }

    // Estimasi berat berdasarkan kelas objek
    function estimateWeight(objectClass) {
        const weightDatabase = {
            "car": 1500,    // Berat mobil dalam kg
            "bottle": 1,    // Berat botol dalam kg
            "apple": 0.2,   // Berat apel dalam kg
            "banana": 0.3,  // Berat pisang dalam kg
            "dog": 10,      // Berat anjing kecil dalam kg
            "cat": 4,       // Berat kucing dalam kg
            "chair": 5,     // Berat kursi dalam kg
            // Tambahkan objek lainnya sesuai kebutuhan
        };
        return weightDatabase[objectClass] || "Tidak diketahui";
    }

    // Mulai kamera dan load model setelah dokumen siap
    startCamera();
    loadModel();
</script>

</body>
</html>
