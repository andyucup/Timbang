<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deteksi Benda & Berat Otomatis</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f8f8f8;
      text-align: center;
      padding: 20px;
    }
    video {
      width: 80%;
      max-width: 600px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    #berat, #object {
      font-size: 20px;
      margin: 10px;
      color: green;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 90%;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>
  <h1>Deteksi Benda & Berat Otomatis</h1>
  <video id="video" autoplay playsinline></video>
  <div id="object">Benda: -</div>
  <div id="berat">Berat: -</div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Benda</th>
        <th>Berat (kg)</th>
        <th>Waktu</th>
      </tr>
    </thead>
    <tbody id="data-table"></tbody>
  </table>

  <script>
    const video = document.getElementById('video');
    const objectLabel = document.getElementById('object');
    const beratLabel = document.getElementById('berat');
    const dataTable = document.getElementById('data-table');
    let objectDetected = "-";
    let beratTimbangan = "-";
    let counter = 1;

    // Akses kamera belakang
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
        video.srcObject = stream;
      } catch (e) {
        console.warn("Tidak bisa akses kamera belakang. Menggunakan kamera default.");
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      }
    }

    // Deteksi benda
    async function loadModel() {
      const model = await cocoSsd.load();
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      setInterval(async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const predictions = await model.detect(canvas);
        if (predictions.length > 0) {
          objectDetected = predictions[0].class;
          objectLabel.textContent = "Benda: " + objectDetected;
        }
      }, 2000);
    }

    // WebSocket ke server timbangan
    const socket = new WebSocket("ws://localhost:8080");

    socket.onmessage = function (event) {
      beratTimbangan = event.data.trim();
      beratLabel.textContent = "Berat: " + beratTimbangan + " kg";

      if (objectDetected !== "-" && beratTimbangan !== "-") {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${counter++}</td><td>${objectDetected}</td><td>${beratTimbangan}</td><td>${new Date().toLocaleString()}</td>`;
        dataTable.appendChild(row);
        objectDetected = "-";
        beratTimbangan = "-";
      }
    };

    // Mulai kamera dan model
    startCamera();
    loadModel();
  </script>
</body>
</html>
